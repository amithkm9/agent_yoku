openapi: 3.1.0
info:
  title: Canonical Documents (Way B)
  version: 1.0.0
  description: >-
    Per-primitive typed schemas for the unified `documents` collection. A shared
    BaseDoc carries the core every document has; each primitive subclass adds the
    structured, queryable fields specific to that kind. UnifiedDoc is the union of
    all primitives — the schema of the single polymorphic `documents` collection.
    Mirrors AsatoCorp's schemas_openapi -> generated Pydantic pattern.

# Custom enums emitted as Python StrEnum (the `domain` field's value set).
x-enums:
  Primitive:
    description: The canonical kinds the agent reasons over (the `domain` field).
    values:
      WORK_ITEM: work_item        # ticket, issue, task, incident, epic
      PULL_REQUEST: pull_request  # PR, merge request
      CONVERSATION: conversation  # chat, email, meeting transcript, comment
      DOCUMENT: document          # page, wiki, spec, README
      EVENT: event                # deploy, build, commit, alert, error
      PERSON: person              # a human, unified across sources

components:
  schemas:

    BaseDoc:
      type: object
      x-config: {extra: allow}
      description: >-
        The core every canonical document shares, regardless of primitive. The
        agent filters by `domain` (the kind), `type` (the variant), and `provider`
        (the vendor). `refs` carries cross-source links in the same
        `provider/native_key` namespace as `key`, so the delivery chain survives
        the projection.
      required: [key, provider, domain]
      properties:
        key:
          type: string
          description: "Canonical key 'provider/native_key', e.g. 'github/AsatoCorp/agent-svc#173'."
          x-display: true
        provider:
          type: string
          description: "Source system that produced this doc, e.g. 'jira' | 'github' | 'slack'."
          x-display: true
          x-filter-arg: provider
        domain:
          type: string
          description: The primitive / kind this doc belongs to.
          x-display: true
          x-filter-arg: domain
          x-enum-ref: Primitive
        type:
          type: string
          description: "Variant within the primitive, e.g. 'ticket' | 'incident' | 'message'."
          x-display: true
          x-filter-arg: type
        title:
          type: string
          description: Short title / summary.
          x-display: true
        body:
          type: string
          description: Full text body.
        author:
          type: string
          description: Author / owner — canonical email or login (auto-resolved).
          x-display: true
          x-filter-arg: author
          x-filter-kind: user
        status:
          type: string
          description: "Domain-normalized status, e.g. 'merged' | 'Done' | 'open'."
          x-display: true
          x-filter-arg: status
        url:
          type: string
          description: Browser URL for the item.
          x-display: true
        created:
          type: string
          description: ISO-8601 (or source-native) creation timestamp.
        updated:
          type: string
          description: ISO-8601 (or source-native) last-updated timestamp.
          x-display: true
        refs:
          type: array
          items: {type: string}
          description: Canonical keys of linked items across sources (the delivery-chain edges).
          x-display: true
          x-filter-arg: has_refs
          x-filter-kind: has_refs
        text:
          type: string
          description: Embed-ready blob (title + body).

    WorkItem:
      description: A unit of tracked work — Jira/Linear ticket, GitHub issue, incident, epic.
      x-config: {extra: allow}
      allOf:
        - $ref: '#/components/schemas/BaseDoc'
        - type: object
          properties:
            priority:
              type: string
              description: "Priority, e.g. 'High'."
              x-display: true
              x-filter-arg: priority
            issue_type:
              type: string
              description: "Issue type, e.g. 'Task' | 'Story' | 'Bug' | 'Epic' | 'Incident'."
              x-display: true
              x-filter-arg: issue_type
            epic_key:
              type: string
              description: Parent epic native key.
              x-filter-arg: epic_key
            parent_key:
              type: string
              description: Parent issue native key (for sub-tasks).
            reporter:
              type: string
              description: Reporter display name.
            labels:
              type: array
              items: {type: string}
              description: Labels.
              x-filter-arg: label
            severity:
              type: string
              description: "Severity for incidents, e.g. 'P1'."
              x-filter-arg: severity
            resolved:
              type: string
              description: ISO-8601 resolution timestamp, if resolved.

    PullRequest:
      description: Code that does the work — GitHub PR, GitLab MR, Bitbucket PR.
      x-config: {extra: allow}
      allOf:
        - $ref: '#/components/schemas/BaseDoc'
        - type: object
          properties:
            repo:
              type: string
              description: "Full repo name, e.g. 'AsatoCorp/agent-svc'."
              x-display: true
              x-filter-arg: repo
              x-normalize: gh_repo
            number:
              type: integer
              description: PR number within the repo.
            merged:
              type: boolean
              default: false
              description: Whether the PR was merged.
              x-display: true
              x-filter-arg: merged
            is_draft:
              type: boolean
              default: false
              description: Whether the PR is a draft.
              x-filter-arg: is_draft
            base:
              type: string
              description: Base branch.
            head:
              type: string
              description: Head branch.
            merged_at:
              type: string
              description: ISO-8601 merge timestamp.
            comments_count:
              type: integer
              default: 0
              description: Number of review/issue comments.
            labels:
              type: array
              items: {type: string}
              description: PR labels.
              x-filter-arg: label

    Conversation:
      description: People exchanging text over time — Slack/Teams message, email, transcript.
      x-config: {extra: allow}
      allOf:
        - $ref: '#/components/schemas/BaseDoc'
        - type: object
          properties:
            channel:
              type: string
              description: "Channel name without '#', e.g. 'engineering'."
              x-display: true
              x-filter-arg: channel
            channel_id:
              type: string
              description: Native channel id.
            channel_type:
              type: string
              description: "Conversation medium: 'channel' | 'dm' | 'email' | 'meeting'."
              x-filter-arg: channel_type
            thread_ts:
              type: string
              description: Parent thread timestamp, if a reply.
              x-display: true
            reply_count:
              type: integer
              default: 0
              description: Number of thread replies.

    UnifiedDoc:
      description: >-
        Union of every primitive — the schema of the polymorphic `documents`
        collection. A stored document is really one primitive (its `domain` says
        which); this union exists so the schema registry exposes every primitive's
        fields as filterable on the single `documents` collection. Unset fields for
        a given primitive are simply absent.
      x-config: {extra: allow}
      allOf:
        - $ref: '#/components/schemas/WorkItem'
        - $ref: '#/components/schemas/PullRequest'
        - $ref: '#/components/schemas/Conversation'
