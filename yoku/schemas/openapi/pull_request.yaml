openapi: 3.1.0
info:
  title: Pull Request
  version: 1.0.0
  description: Code that does the work — GitHub PR, GitLab MR, Bitbucket PR.

components:
  schemas:

    PullRequest:
      description: Code that does the work — GitHub PR, GitLab MR, Bitbucket PR.
      x-config: {extra: allow}
      allOf:
        - $ref: './base.yaml#/components/schemas/BaseDoc'
        - type: object
          properties:
            repo:
              type: string
              description: "Full repo name, e.g. 'AsatoCorp/agent-svc'."
              x-display: true
              x-filter-arg: repo
              x-normalize: gh_repo
            number:
              type: integer
              description: PR number within the repo.
            merged:
              type: boolean
              default: false
              description: Whether the PR was merged.
              x-display: true
              x-filter-arg: merged
            is_draft:
              type: boolean
              default: false
              description: Whether the PR is a draft.
              x-filter-arg: is_draft
            base:
              type: string
              description: Base branch.
            head:
              type: string
              description: Head branch.
            merged_at:
              type: string
              description: ISO-8601 merge timestamp.
            comments_count:
              type: integer
              default: 0
              description: Number of review/issue comments.
            labels:
              type: array
              items: {type: string}
              description: PR labels.
              x-filter-arg: label
