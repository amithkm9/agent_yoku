openapi: 3.1.0
info:
  title: Work Item
  version: 1.0.0
  description: A unit of tracked work — Jira/Linear ticket, GitHub issue, incident, epic.

components:
  schemas:

    WorkItem:
      description: A unit of tracked work — Jira/Linear ticket, GitHub issue, incident, epic.
      x-config: {extra: allow}
      required: [key, provider, domain]
      properties:
        key:
          type: string
          description: "Canonical key 'provider/native_key', e.g. 'jira/AS-1234'."
          x-display: true
        provider:
          type: string
          description: "Source system that produced this doc, e.g. 'jira'."
          x-display: true
          x-filter-arg: provider
        domain:
          type: string
          description: The primitive / kind this doc belongs to.
          x-display: true
          x-filter-arg: domain
          x-enum-values: [work_item, pull_request, conversation, document, event, person]
        type:
          type: string
          description: "Variant within the primitive, e.g. 'ticket' | 'incident'."
          x-display: true
          x-filter-arg: type
        title:
          type: string
          description: Short title / summary.
          x-display: true
        body:
          type: string
          description: Full text body.
        author:
          type: string
          description: Author / owner — canonical email or login (auto-resolved).
          x-display: true
          x-filter-arg: author
          x-filter-kind: user
        status:
          type: string
          description: "Domain-normalized status, e.g. 'Done' | 'open'."
          x-display: true
          x-filter-arg: status
        url:
          type: string
          description: Browser URL for the item.
          x-display: true
        created:
          type: string
          description: ISO-8601 (or source-native) creation timestamp.
        updated:
          type: string
          description: ISO-8601 (or source-native) last-updated timestamp.
          x-display: true
        refs:
          type: array
          items: {type: string}
          description: Canonical keys of linked items across sources.
          x-display: true
          x-filter-arg: has_refs
          x-filter-kind: has_refs
        text:
          type: string
          description: Embed-ready blob (title + body).
        priority:
          type: string
          description: "Priority, e.g. 'High'."
          x-display: true
          x-filter-arg: priority
        issue_type:
          type: string
          description: "Issue type, e.g. 'Task' | 'Story' | 'Bug' | 'Epic' | 'Incident'."
          x-display: true
          x-filter-arg: issue_type
        epic_key:
          type: string
          description: Parent epic native key.
          x-filter-arg: epic_key
        parent_key:
          type: string
          description: Parent issue native key (for sub-tasks).
        reporter:
          type: string
          description: Reporter display name.
        labels:
          type: array
          items: {type: string}
          description: Labels.
          x-filter-arg: label
        severity:
          type: string
          description: "Severity for incidents, e.g. 'P1'."
          x-filter-arg: severity
        resolved:
          type: string
          description: ISO-8601 resolution timestamp, if resolved.
