[tool.poetry]
name = "agent-yoku"
version = "0.1.0"
description = "JIRA + GitHub PR deepagent over local mongo + OpenAI embeddings."
authors = ["Akshay Reddy <akshay.reddy@asato.ai>"]
readme = "README.md"
packages = [{include = "agent_yoku"}]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32"
pymongo = "^4.8"
openai = "^2.37"
python-dotenv = "^1.0"
pydantic-settings = "^2.4"
numpy = "^1.26"
streamlit = "^1.36"
click = "^8.1"
tenacity = "^9.0"
langchain = "^1.3"
langchain-openai = "^1.2"
langchain-core = "^1.4"
langgraph = "^1.2"
deepagents = "^0.6.2"
# API
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
# Auth
python-jose = { extras = ["cryptography"], version = "^3.3" }
bcrypt = "^4.2"
python-multipart = "^0.0.20"
apscheduler = "^3.11.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"
black = "^24.10"
autoflake = "^2.3"
pre-commit = "^4.0"
pytest = "^8.3"
pytest-cov = "^5.0"

[tool.poetry.scripts]
agent-yoku = "agent_yoku.cli:cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# =================== Tooling ===================

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line too long (handled by black)
    "B008",     # function-call-in-default-argument (Click defaults)
    "B905",     # zip() strict — readability cost > value here
    "E741",     # single-letter var name (l is fine in tight scope)
    "UP028",    # yield-in-for-loop — pagination generators are clearer as-is
    "RUF001",   # ambiguous unicode in strings (we use em-dash intentionally)
    "RUF002",   # ambiguous unicode in docstrings
    "RUF003",   # ambiguous unicode in comments
    "RUF005",   # collection-literal-concatenation
]

[tool.ruff.lint.per-file-ignores]
"cli.py" = ["E402"]  # imports inside functions for lazy load

[tool.autoflake]
remove-all-unused-imports = true
remove-unused-variables = true
in-place = true
recursive = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast in-memory tests",
    "integration: hit a real mongo / external API",
]
